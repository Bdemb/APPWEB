name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ["*.zip", ".github/workflows/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le projet
        run: |
          mkdir work
          unzip -q appweb.zip -d work
          unzip -q -o launcher-patch.zip -d work
          ls work/android-launcher
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: work/android-launcher
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-c4-apk
          path: work/android-launcher/app/build/outputs/apk/debug/*.apk
