name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ["**.zip", ".github/workflows/**", "android-launcher/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le projet
        id: prep
        run: |
          mkdir /tmp/work
          if [ -f appweb.zip ]; then
            unzip -q appweb.zip -d /tmp/work
          else
            rsync -a --exclude .git ./ /tmp/work/
          fi
          if [ -f launcher-patch.zip ]; then
            unzip -q -o launcher-patch.zip -d /tmp/work
          fi
          G=$(find /tmp/work -name settings.gradle.kts -not -path '*/node_modules/*' | head -1)
          if [ -z "$G" ]; then echo "Projet Android introuvable"; find /tmp/work -maxdepth 2; exit 1; fi
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"
          ls "$(dirname "$G")" "$(dirname "$G")/app/src/main/res" || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ steps.prep.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-c4-apk
          path: ${{ steps.prep.outputs.dir }}/app/build/outputs/apk/debug/*.apk
